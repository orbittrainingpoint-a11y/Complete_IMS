{% extends 'base_generic.html' %}

{% block content %}
<h2>Confirm Delete</h2>
<p>Are you sure you want to delete the trainer profile for "{{ profile.name }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm Delete</button>
    <a href="{% url 'trainer_profile_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
