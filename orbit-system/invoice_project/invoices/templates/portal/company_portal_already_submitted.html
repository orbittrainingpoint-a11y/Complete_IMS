<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Already Submitted — Orbit Training</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
body { background:#f8faff; font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
.card { border:none; border-radius:20px; box-shadow:0 8px 40px rgba(0,0,0,.08); padding:48px 40px; max-width:540px; width:100%; text-align:center; }
</style>
</head>
<body>
<div class="card">
    <i class="fas fa-info-circle fa-3x mb-3" style="color:#2563eb;"></i>
    <h2 style="font-weight:800;">Already Submitted</h2>
    <p style="color:#64748b;margin:16px 0;">
        Company details for <strong>{{ portal.company_name }}</strong> were already submitted on
        {{ portal.submitted_at|date:"d M Y" }}.
    </p>
    <a href="{% url 'company_portal_add_attendees' token=portal.token %}"
       class="btn btn-primary" style="padding:12px 28px;border-radius:10px;font-weight:700;">
        <i class="fas fa-users me-2"></i>Manage Training Attendees
    </a>
</div>
</body>
</html>
