{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>{{ title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy-deep: #0f1b2d;
    --navy: #16233a;
    --blue: #2563eb;
    --sky: #60a5fa;
    --display: "Montserrat", "Segoe UI", system-ui, sans-serif;
    --body: "Open Sans", "Segoe UI", system-ui, sans-serif;
    --hero-bg:
      radial-gradient(120% 90% at 86% 6%, rgba(96,165,250,.55) 0%, rgba(96,165,250,0) 46%),
      linear-gradient(128deg, #0f1b2d 0%, #16233a 40%, #2563eb 74%, #60a5fa 100%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @page { size: 297mm 210mm; margin: 0; }
  html, body { width: 100%; margin: 0; padding: 0; }
  body {
    font-family: var(--body);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .page {
    width: 297mm; height: 210mm;
    background: var(--hero-bg);
    color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 8mm;
  }
  .logo img { height: 34px; width: auto; margin-bottom: 14mm; }
  .pill {
    display: inline-block;
    background: linear-gradient(90deg, #2563eb, #3b82f6);
    font-family: var(--display); font-weight: 700;
    font-size: 10pt; letter-spacing: .14em; text-transform: uppercase;
    padding: 4px 14px; border-radius: 24px; margin-bottom: 7mm;
  }
  h1 {
    font-family: var(--display); font-weight: 800;
    font-size: 34pt; letter-spacing: -.4px; line-height: 1.1;
  }
  p.subtitle {
    font-size: 13pt; color: #e9f1ff; margin-top: 6mm; max-width: 170mm;
  }
</style>
</head>
<body>
<section class="page">
  <div class="logo"><img src="{% static 'orbit-logo-white.png' %}" alt="Orbit Training Center" /></div>
  <span class="pill">{{ eyebrow|default:"Orbit Training Center" }}</span>
  <h1>{{ title }}</h1>
  {% if subtitle %}<p class="subtitle">{{ subtitle }}</p>{% endif %}
</section>
</body>
</html>
