{% extends 'base_generic.html' %}

{% block content %}
<h1>Delete Proposal</h1>
<p>Are you sure you want to delete the proposal for {{ proposal.client_name }}?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm Delete</button>
</form>
<a href="{% url 'proposal_dashboard' %}">Cancel</a>
{% endblock %}
