<style>
.ts-nav { position:sticky; top:0; z-index:30; background:var(--bg,#f1f5f9); padding:8px 0 10px; margin-bottom:14px; }
.ts-row { display:flex; gap:6px; align-items:center; overflow-x:auto; white-space:nowrap; scrollbar-width:thin; padding-bottom:2px; }
.ts-row + .ts-row { margin-top:8px; }
.ts-tab { display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:11px; font-size:13px; font-weight:700; text-decoration:none;
          border:1px solid var(--border); color:#475569; background:#fff; transition:.15s; flex-shrink:0; }
.ts-tab i { font-size:13px; opacity:.8; } .ts-tab:hover { border-color:var(--primary); color:var(--primary); }
.ts-tab.on { background:var(--primary); color:#fff; border-color:var(--primary); box-shadow:0 3px 10px rgba(37,99,235,.28); } .ts-tab.on i { opacity:1; }
.ts-tab.sm { padding:5px 11px; font-size:12px; font-weight:600; border-radius:9px; }
.ts-tab.cta { background:#059669; color:#fff; border-color:#059669; margin-left:auto; } .ts-tab.cta:hover { color:#fff; filter:brightness(1.08); }
.ts-badge { font-size:10px; font-weight:800; min-width:18px; text-align:center; padding:1px 6px; border-radius:20px; background:rgba(15,23,42,.1); color:#334155; }
.ts-tab.on .ts-badge { background:rgba(255,255,255,.25); color:#fff; } .ts-badge.warn { background:#f59e0b; color:#fff; } .ts-badge.red { background:#ef4444; color:#fff; }
.ts-search { position:relative; flex:1; min-width:210px; max-width:420px; margin-left:auto; }
.ts-search input { width:100%; border:1px solid var(--border); border-radius:11px; padding:7px 12px 7px 34px; font-size:13px; background:#fff; }
.ts-search i { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:12px; }
.ts-strip { display:flex; flex-wrap:wrap; gap:3px; align-items:center; }

.ts-pill { display:inline-block; font-size:11px; font-weight:700; padding:2px 10px; border-radius:20px; }
.pill-free { background:rgba(16,185,129,.12); color:#047857; } .pill-busy { background:rgba(239,68,68,.12); color:#b91c1c; }
.pill-leave { background:rgba(245,158,11,.15); color:#b45309; } .pill-off { background:rgba(100,116,139,.12); color:#475569; }
.pill-upcoming, .pill-scheduled, .pill-active { background:rgba(37,99,235,.1); color:#1d4ed8; } .pill-ongoing, .pill-completed-ok { background:rgba(16,185,129,.12); color:#047857; }
.pill-completed { background:rgba(16,185,129,.14); color:#065f46; } .pill-cancelled, .pill-absent { background:rgba(239,68,68,.1); color:#b91c1c; }
.pill-paused { background:rgba(245,158,11,.18); color:#92400e; } .pill-rescheduled { background:rgba(124,58,237,.12); color:#5b21b6; }
.ts-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--text-muted); display:block; margin-bottom:4px; }
.ts-alert-err { background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.3); color:#991b1b; border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:10px; }
.ts-alert-warn { background:rgba(245,158,11,.1); border:1px solid rgba(245,158,11,.35); color:#92400e; border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:10px; }

.ts-bar { height:6px; border-radius:4px; background:#e5e7eb; overflow:hidden; } .ts-bar i { display:block; height:100%; }
.u-low { background:#f59e0b; } .u-ok { background:#10b981; } .u-high { background:#ef4444; }
