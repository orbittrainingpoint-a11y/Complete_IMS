<style>
.ac-nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px;margin-bottom:18px}
.ac-tab{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:#475569;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.ac-tab:hover{background:#f1f5f9;color:#1e293b}.ac-tab.on{background:#eff6ff;color:#2563eb}
.ac-tab.cta{background:#2563eb;color:#fff;margin-left:auto}.ac-tab.cta:hover{background:#1d4ed8}
.ac-badge{background:#ef4444;color:#fff;border-radius:10px;font-size:10px;padding:1px 7px}
.ac-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:18px}
.ac-card h6{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:#64748b;font-weight:700;margin-bottom:12px}
.ac-num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ac-pos{color:#059669}.ac-neg{color:#dc2626}
.ac-kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;height:100%}
.ac-kpi .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}.ac-kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#64748b;font-weight:600}
.ac-kpi .s{font-size:11px;color:#94a3b8;margin-top:2px}
.ac-table th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#64748b;font-weight:600;white-space:nowrap}
.ac-table td{font-size:13px;vertical-align:middle}
.ac-pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:12px;background:#f1f5f9;color:#475569}
.ac-pill.posted{background:#dcfce7;color:#166534}.ac-pill.pending{background:#fef3c7;color:#92400e}
.ac-pill.rejected,.ac-pill.void{background:#fee2e2;color:#991b1b}
.ac-typeswitch{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ac-typeswitch a{font-size:12px;padding:6px 12px;border-radius:20px;border:1px solid var(--border);text-decoration:none;color:#475569;background:#fff}
.ac-typeswitch a.on{background:#2563eb;border-color:#2563eb;color:#fff}
.ac-bar{height:8px;border-radius:4px;background:#e2e8f0;overflow:hidden}.ac-bar i{display:block;height:100%}
.ac-hint{font-size:12px;color:#64748b}
</style>
<div class="ac-nav">
  <a href="{% url 'accounting_home' %}" class="ac-tab {% if active == 'home' %}on{% endif %}"><i class="fas fa-scale-balanced"></i>Overview</a>
  <a href="{% url 'accounting_txn_list' %}" class="ac-tab {% if active == 'txns' %}on{% endif %}"><i class="fas fa-money-bill-transfer"></i>Transactions{% if pending_count and acc_is_admin %} <span class="ac-badge">{{ pending_count }}</span>{% endif %}</a>
  <a href="{% url 'accounting_bills' %}" class="ac-tab {% if active == 'bills' %}on{% endif %}"><i class="fas fa-file-invoice-dollar"></i>Bills</a>
  <a href="{% url 'accounting_receivables' %}" class="ac-tab {% if active == 'ar' %}on{% endif %}"><i class="fas fa-hand-holding-dollar"></i>Receivables &amp; Payables</a>
  <a href="{% url 'accounting_accounts' %}" class="ac-tab {% if active == 'accounts' %}on{% endif %}"><i class="fas fa-building-columns"></i>Bank &amp; Cash</a>
  <a href="{% url 'accounting_reports' %}" class="ac-tab {% if active == 'reports' %}on{% endif %}"><i class="fas fa-chart-line"></i>Reports &amp; VAT</a>
  {% if acc_is_admin %}<a href="{% url 'accounting_settings' %}" class="ac-tab {% if active == 'settings' %}on{% endif %}"><i class="fas fa-sliders"></i>Settings</a>{% endif %}
  {% if setting.books_start_date %}<a href="{% url 'accounting_txn_add' %}" class="ac-tab cta"><i class="fas fa-plus"></i>New Entry</a>{% endif %}
</div>
