<VirtualHost *:80>
    ServerName crm.orbittraining.online
    Redirect permanent / https://crm.orbittraining.online/
</VirtualHost>

<VirtualHost *:443>
    ServerName crm.orbittraining.online

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/crm.orbittraining.online/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/crm.orbittraining.online/privkey.pem

    # Proxy to Gunicorn CRM
    ProxyPreserveHost On
    ProxyPass         /static/ !
    ProxyPass         / http://127.0.0.1:5001/
    ProxyPassReverse  / http://127.0.0.1:5001/

    # Flask static files
    Alias /static/ /var/www/html/orbit/leads-management/static/
    <Directory /var/www/html/orbit/leads-management/static/>
        Require all granted
        Options -Indexes
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/crm_error.log
    CustomLog ${APACHE_LOG_DIR}/crm_access.log combined
</VirtualHost>
